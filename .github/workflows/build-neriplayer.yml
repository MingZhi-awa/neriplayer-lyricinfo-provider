name: Build NeriPlayer LyricInfo Provider

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    name: Test and assemble
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Setup Gradle with caching
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: wrapper

      - name: Run provider unit tests
        run: ./gradlew :player-neriplayer:testDebugUnitTest --rerun-tasks

      - name: Build debug APK
        run: ./gradlew :player-neriplayer:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: neriplayer-lyricinfo-provider-debug
          path: player-neriplayer/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neriplayer-provider-test-reports
          path: player-neriplayer/build/reports/tests/**
          if-no-files-found: ignore
